<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D7C"/>
      <stop offset="100%" stop-color="#181DA8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#2d241e"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5"/>
      <stop offset="100%" stop-color="#F5BA93"/>
    </linearGradient>
    <linearGradient id="blouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF0178"/>
      <stop offset="100%" stop-color="#BA0063"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Hair Back -->
  <path d="M 45 60 C 35 75 35 110 42 125 C 50 140 60 142 60 142 L 100 142 C 100 142 110 140 118 125 C 125 110 125 75 115 60 Z" fill="url(#hairGrad)"/>

  <!-- Neck -->
  <rect x="73" y="85" width="14" height="22" rx="4" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M 73 95 Q 80 99 87 95 L 87 90 L 73 90 Z" fill="#E5A67E" opacity="0.4"/>

  <!-- Head Base -->
  <ellipse cx="80" cy="62" rx="26" ry="30" fill="url(#skinGrad)" filter="url(#softShadow)"/>

  <!-- Ears -->
  <ellipse cx="53" cy="64" rx="4" ry="7" fill="#F5BA93"/>
  <ellipse cx="107" cy="64" rx="4" ry="7" fill="#F5BA93"/>
  <!-- Earring -->
  <circle cx="53" cy="68" r="2" fill="#FEE500"/>
  <circle cx="107" cy="68" r="2" fill="#FEE500"/>

  <!-- Hair Front / Style -->
  <path d="M 52 56 C 50 30 70 20 82 20 C 100 20 112 32 108 56 C 102 46 95 44 88 45 C 75 46 64 48 52 56 Z" fill="url(#hairGrad)"/>
  <path d="M 52 56 C 56 70 54 85 58 92 C 60 85 64 70 65 62 C 60 58 55 58 52 56 Z" fill="url(#hairGrad)"/>
  <path d="M 108 56 C 104 70 106 85 102 92 C 100 85 96 70 95 62 C 100 58 105 58 108 56 Z" fill="url(#hairGrad)"/>

  <!-- Eyebrows -->
  <path d="M 64 50 Q 71 47 76 50" stroke="#2d241e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 84 50 Q 89 47 96 50" stroke="#2d241e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="70" cy="58" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="71.5" cy="56.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="90" cy="58" rx="4" ry="4.5" fill="#1e1b18"/>
  <circle cx="91.5" cy="56.5" r="1.5" fill="#ffffff"/>

  <!-- Eyelashes -->
  <path d="M 65 55 Q 71 52 75 55" stroke="#1e1b18" stroke-width="1.2" fill="none"/>
  <path d="M 85 55 Q 89 52 95 55" stroke="#1e1b18" stroke-width="1.2" fill="none"/>

  <!-- Nose -->
  <path d="M 80 58 L 78 66 L 82 66" stroke="#D99B73" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cheerful Smile -->
  <path d="M 72 73 Q 80 81 88 73" stroke="#BA0063" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 73 73 Q 80 79 87 73" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="64" cy="67" rx="4.5" ry="2.5" fill="#DF0178" opacity="0.25"/>
  <ellipse cx="96" cy="67" rx="4.5" ry="2.5" fill="#DF0178" opacity="0.25"/>

  <!-- Blouse (Inner V-neck) -->
  <path d="M 72 103 L 80 126 L 88 103 Z" fill="url(#blouseGrad)"/>
  <path d="M 77 114 L 80 126 L 83 114 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Body / Blazer Suit -->
  <!-- Left Torso & Shoulder -->
  <path d="M 52 110 C 40 115 36 128 32 155 L 30 215 L 75 215 L 76 138 L 52 110 Z" fill="url(#suitGrad)"/>
  <!-- Right Torso & Shoulder -->
  <path d="M 108 110 C 120 115 124 128 126 155 L 128 215 L 85 215 L 84 138 L 108 110 Z" fill="url(#suitGrad)"/>

  <!-- Suit Lapels (Collar) -->
  <!-- Left Lapel -->
  <path d="M 62 103 L 73 135 L 80 135 L 71 103 Z" fill="#070954"/>
  <!-- Right Lapel -->
  <path d="M 98 103 L 87 135 L 80 135 L 89 103 Z" fill="#070954"/>

  <!-- Sanasa Badge on Lapel -->
  <circle cx="67" cy="120" r="3" fill="#FEE500"/>
  <circle cx="67" cy="120" r="1.5" fill="#DF0178"/>

  <!-- Welcoming Right Arm (Gesturing towards viewer / chat card) -->
  <!-- Upper Arm -->
  <path d="M 118 118 C 128 128 135 142 140 155 L 126 162 C 122 150 116 138 108 130 Z" fill="url(#suitGrad)"/>
  <!-- Forearm & Hand gesturing forward/right -->
  <path d="M 136 153 L 152 148 C 156 147 159 150 157 154 L 148 168 C 145 172 139 172 135 168 L 126 160 Z" fill="url(#skinGrad)"/>
  <!-- Sleeve Cuff -->
  <path d="M 128 155 L 138 152 L 140 162 L 130 165 Z" fill="#070954"/>
  <!-- Welcoming Hand Fingers gesture -->
  <path d="M 152 148 C 158 145 160 150 155 155" stroke="#F5BA93" stroke-width="1.5" fill="none"/>

  <!-- Left Arm (Holding clipboard or relaxed at side) -->
  <path d="M 42 118 C 34 128 28 145 26 165 L 36 168 C 38 152 44 138 52 128 Z" fill="url(#suitGrad)"/>
  <ellipse cx="28" cy="172" rx="6" ry="7" fill="url(#skinGrad)"/>
  <!-- Sleeve Cuff -->
  <path d="M 27 163 L 37 165 L 36 170 L 26 168 Z" fill="#070954"/>

  <!-- Golden Glow / Sparkle -->
  <path d="M 148 132 L 150 137 L 155 139 L 150 141 L 148 146 L 146 141 L 141 139 L 146 137 Z" fill="#FEE500" opacity="0.9"/>
  <circle cx="154" cy="128" r="1.5" fill="#FEE500"/>
</svg>
